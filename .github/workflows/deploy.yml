name: Build and Deploy Next.js to Azure App Service

on:
  push:
    branches: [ "main" ] # Triggers whenever you push code to your main branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies and build
      run: |
        npm ci
        npx prisma generate
        npm run build
      env:
        DATABASE_URL: "postgresql://mekaadmin:Common%40sence500%3F%21@mekawc-db-bnsneazvqdw6i.postgres.database.azure.com:5432/postgres?sslmode=require"
        RESEND_API_KEY: "${{ secrets.RESEND_API_KEY }}"
        AUTH_SECRET: "${{ secrets.AUTH_SECRET }}"
        AUTH_GOOGLE_ID: "${{ secrets.AUTH_GOOGLE_ID }}"
        AUTH_GOOGLE_SECRET: "${{ secrets.AUTH_GOOGLE_SECRET }}"
        NEXT_PUBLIC_SUPABASE_URL: "https://auieyynwtskqhewkcutw.supabase.co"
        NEXT_PUBLIC_SUPABASE_ANON_KEY: "sb_publishable_A68zcLFSvlmARPdkj8JLRg_EuLkF6x9"
        SUPABASE_SERVICE_ROLE_KEY: "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
        SUPABASE_STORAGE_BUCKET: "product-images"
        NEXT_PUBLIC_SITE_URL: "https://mekawc-app-bnsneazvqdw6i.azurewebsites.net"
        EMAIL_FROM: "MekaWC <onboarding@resend.dev>"
        EMAIL_TEST_RECIPIENT: "leratomoshabi500@gmail.com"
        STORE_OWNER_EMAIL: "leratomoshabi500@gmail.com"
        AUTH_TRUST_HOST: "true"

    - name: Prepare Standalone Artifact
      run: |
        mkdir -p .next/standalone/public
        mkdir -p .next/standalone/.next/static
        cp -R public/* .next/standalone/public/
        cp -R .next/static/* .next/standalone/.next/static/

    - name: Deploy to Azure App Service
      uses: azure/webapps-deploy@v3
      with:
        app-name: 'mekawc-app-bnsneazvqdw6i'
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: '.next/standalone'