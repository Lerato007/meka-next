<svg width="1200" height="600" viewBox="0 0 1200 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark Grid Background -->
  <rect width="1200" height="600" fill="#09090B"/>
  
  <!-- Subtle Grid Pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#27272A" stroke-width="0.5"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#09090B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#grid)"/>
  <circle cx="600" cy="300" r="400" fill="url(#glow)"/>

  <!-- Centered Streetwear Bucket Hat Vector -->
  <g transform="translate(600, 260) scale(1.1)">
    <!-- Hat Shadow -->
    <ellipse cx="0" cy="110" rx="190" ry="25" fill="#000000" opacity="0.6"/>

    <!-- Bucket Hat Brim (Back Curve) -->
    <path d="M -180 80 C -180 110, 180 110, 180 80 L 140 30 C 100 45, -100 45, -140 30 Z" fill="#18181B"/>

    <!-- Hat Crown (Body) -->
    <path d="M -130 35 C -120 -50, 120 -50, 130 35 C 80 50, -80 50, -130 35 Z" fill="#27272A" stroke="#3F3F46" stroke-width="2"/>
    
    <!-- Hat Crown Top Flat Surface -->
    <ellipse cx="0" cy="-45" rx="105" ry="30" fill="#3F3F46" stroke="#52525B" stroke-width="2"/>

    <!-- Brim (Front Down Slope) -->
    <path d="M -180 75 C -100 120, 100 120, 180 75 L 130 35 C 80 55, -80 55, -130 35 Z" fill="#18181B" stroke="#27272A" stroke-width="2"/>

    <!-- Brim Stitching Detail Lines -->
    <path d="M -165 73 C -90 110, 90 110, 165 73" fill="none" stroke="#3F3F46" stroke-width="1.5" stroke-dasharray="4 3"/>
    <path d="M -150 63 C -80 98, 80 98, 150 63" fill="none" stroke="#3F3F46" stroke-width="1.5" stroke-dasharray="4 3"/>

    <!-- Front Logo Patch (MekaWC Emblem) -->
    <rect x="-35" y="-15" width="70" height="40" rx="6" fill="#09090B" stroke="#52525B" stroke-width="1.5"/>
    <!-- Outer Ring Logo -->
    <circle cx="0" cy="5" r="12" fill="none" stroke="#10B981" stroke-width="2.5"/>
    <circle cx="0" cy="5" r="6" fill="#10B981"/>
    <!-- Logo "M" -->
    <text x="0" y="8.5" text-anchor="middle" fill="#09090B" font-family="sans-serif" font-weight="900" font-size="8">M</text>
  </g>

  <!-- Typography Banner Overlay -->
  <text x="600" y="110" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-weight="900" font-size="44" letter-spacing="10">
    HEADWEAR
  </text>
  
  <text x="600" y="145" text-anchor="middle" fill="#A1A1AA" font-family="sans-serif" font-weight="700" font-size="14" letter-spacing="10">
    SIGNATURE BUCKET HAT // DROP 01
  </text>

  <!-- Red Accent Line -->
  <line x1="500" y1="480" x2="700" y2="480" stroke="#EF4444" stroke-width="4"/>

  <text x="600" y="520" text-anchor="middle" fill="#10B981" font-family="sans-serif" font-weight="800" font-size="16" letter-spacing="4">
    COMING SOON
  </text>
</svg>
